<mat-tab-group>
    <mat-tab label="Overview">
        <app-key-value-table [dataSource]="overviewData"></app-key-value-table>
    </mat-tab>
    <mat-tab label="Character Stats">
    </mat-tab>              
    <mat-tab label="Achievements">
        <mat-tab-group>
            <mat-tab label="Achievements">
                <ng-template matTabContent>
                    <table mat-table class="achievements" [dataSource]="achievementData" class="mat-elevation-z8">
                        <ng-container matColumnDef="name">
                            <th mat-header-cell *matHeaderCellDef> Achievement </th>
                            <td mat-cell *matCellDef="let item"> {{item.achievement.name}} </td>
                        </ng-container>
                        <ng-container matColumnDef="completed">
                            <th mat-header-cell *matHeaderCellDef> Completed </th>
                            <td mat-cell *matCellDef="let item"> 
                                @if(item.criteria!.is_completed) {
                                    {{item.completed_timestamp | date: 'yyyy-MM-dd HH:mm'}}
                                } @else {
                                    incomplete
                                }
                            </td>
                        </ng-container>
                        <tr mat-header-row *matHeaderRowDef="['name', 'completed']; sticky:true"></tr>
                        <tr mat-row *matRowDef="let row; columns: ['name','completed'];"></tr>
                    </table>
                </ng-template>
            </mat-tab> 
            <mat-tab label="Statistics">
            </mat-tab> 
        </mat-tab-group>
    </mat-tab>
    <mat-tab label="Appearances">
    </mat-tab>
    <mat-tab label="Collections">
        <mat-tab-group>
            <mat-tab label="Heirlooms">
            </mat-tab> 
            <mat-tab label="Mounts">
            </mat-tab> 
            <mat-tab label="Pets">
            </mat-tab> 
            <mat-tab label="Toys">
            </mat-tab> 
            <mat-tab label="Transmogs">
            </mat-tab>                                                  
        </mat-tab-group>
    </mat-tab> 
    <mat-tab label="Encounters">
        <mat-tab-group>
            <mat-tab label="Dungeons">
            </mat-tab> 
            <mat-tab label="Raids">
            </mat-tab>                                               
        </mat-tab-group>
    </mat-tab>            
    <mat-tab label="Equipment">
    </mat-tab>    
    <mat-tab label="Mythic Keystones">
    </mat-tab>        
    <mat-tab label="Professions">
    </mat-tab>       
    <mat-tab label="PvP">
    </mat-tab>      
    <mat-tab label="Quests">
    </mat-tab>   
    <mat-tab label="Reputation">
    </mat-tab>   
    <mat-tab label="Soulbinds">
    </mat-tab>                                                
</mat-tab-group>
