<mat-form-field>
    <mat-label>Category</mat-label>
    <mat-select [formControl]="currentIndex" (selectionChange)="selectChanged()">
      @for (item of pages(); track $index) {
        <mat-option [value]="$index">{{ getItem(item)[selector()] }}</mat-option>
      }
    </mat-select>
</mat-form-field>
<div class="selectorContents">
    <ng-container *ngTemplateOutlet="templateRef!; context: {$implicit: currentPage}"></ng-container>
</div>
