name: Node.js CI

on:
  push:
     tags:
       - '*'
  workflow_dispatch:

jobs:
  build:
    name: Publish for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
#          - os: ubuntu-latest
#            artifact_name: mything
#            asset_name: Battle.net API Browser - linux-amd64
          - os: windows-latest
            artifact_name: "battlenet-api-browser-0.3.0-dev Setup.exe"
            asset_name: Battle.net API Browser - Windows x64
         

    steps:
    - uses: actions/checkout@v4
    - name: Build    
      run: npm run github-make-release
      working-directory: battlenet-api-browser
    - name: Upload web zip to release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "release.tar.gz,foo/*.txt"
        bodyFile: "body.md"    
        asset_name: Battlenet API Browser (Web) ${{ github.ref }}
        tag: ${{ github.ref }}
        prerelease: true
        allowUpdates: true

    