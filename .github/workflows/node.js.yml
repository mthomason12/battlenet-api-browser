name: Node.js CI

on:
  push:
     tags:
       - '*'
  workflow_dispatch:

jobs:
  build:
    name: Publish for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions: write-all

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifacts: "battlenet-api-browser/out/make/zip/linux/*.zip, battlenet-api-browser/out/make/deb/x64/*.deb, battlenet-api-browser/out/make/rpm/x64/*.rpm"
          - os: windows-latest
            artifacts: "battlenet-api-browser/out/make/squirrel.windows/x64/*.exe,battlenet-api-browser/out/make/zip/win32/x64/*.zip,battlenet-api-browser/out/make/zip/web/*.zip"
          - os: macos-13
            artifacts: "battlenet-api-browser/out/make/zip/darwin/*.zip"
          - os: macos-latest
            artifacts: "battlenet-api-browser/out/make/zip/darwin/*.zip"

         

    steps:
    - uses: actions/checkout@v4
    - name: Build    
      run: npm run github-make-release-${{matrix.os}}
      working-directory: battlenet-api-browser
    - name: Get version from package.json
      id: get-version
      uses: beaconbrigade/package-json-version@v0.3.2
      with:
        path: battlenet-api-browser     
    - name: Upload releases
      uses: ncipollo/release-action@v1
      with:
        artifacts: ${{matrix.artifacts}}
        name: Battlenet API Browser ${{ steps.get-version.outputs.version }}
        body: Check CHANGELOG for changes        
        prerelease: true
        allowUpdates: true
